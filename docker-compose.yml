version: '3.8'

services:
  interstellar-core:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=genesis
      - DATABASE_URL=mongodb://exploration-db:27017
    depends_on:
      - exploration-db
    restart: always

  exploration-db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - system_data:/data/db
    restart: always

volumes:
  system_data: